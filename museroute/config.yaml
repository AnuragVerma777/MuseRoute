# Configure each tier independently. Keep host/model values in the local .env.
tiers:
  cheap:
    name: cheap
    base_url: ${CHEAP_BASE_URL}
    model_id: ${CHEAP_MODEL_ID}
    api_key_env: CHEAP_API_KEY
    cost_weight: null # TODO: derive a relative weight from measured local GPU use
    extra_params:
      reasoning_effort: low
  strong:
    name: strong
    base_url: ${STRONG_BASE_URL}
    model_id: ${STRONG_MODEL_ID}
    api_key_env: STRONG_API_KEY
    cost_weight: null # TODO: derive a relative weight from measured local GPU use
    extra_params:
      reasoning_effort: high

policy:
  allowed_models: ["muse"]
  blocked_hosts: ["api.meta.ai"]
